<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Cifra & Acordes</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://jtab.tardate.com/css/jtab-helper.css" type="text/css" />
</head>
<body>
    <div class="container">
        <div class="content">
            <h1> Assistente de Cifras</h1>
            <p>Abaixo, informe uma cifra e o instrumento que você desejar, que será gerado um conjunto de acordes do mesmo campo harmônico.</p>
            <div class="content-div">
                <form id="meuFormulario" action="" onsubmit="event.preventDefault(); enviar();">
                    <label for="cifra">
                        Cifra: <input type="text" id="cifra" name="cifra" placeholder="Bm">
                    </label>
                    <div class="content-div-div">
                        <button type="submit">Enviar</button>
                        <button type="button" onclick="limpar()">Limpar</button>
                    </div>
                </form>
            </div>
            <h2>Seus Acordes:</h2>
            <pre id="resposta">Aparecem aqui...</pre>     
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
    <script src="https://jtab.tardate.com/javascripts/jtab.js"></script>

    <script >
        async function enviar() {
            const cifra = document.getElementById("cifra").value;
            prompt = cifra

            const output = document.getElementById("resposta");
            output.textContent = "Consultando a IA...";
            try {
                const response = await fetch("/api/llm", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();

                if (!response.ok) {
                    output.textContent = data.erro || "Erro desconhecido.";
                    return;
                }

                // 1. Limpa a string removendo os colchetes enviados pela IA
                const apenas_letras = data.resposta.replace(/[\[\]]/g, "").trim();

                // 2. Opcional: Log direto no Console do Navegador (F12) para depuração
                console.log("Acordes resposta:", data.resposta);
                console.log("Acordes processados:", apenas_letras);
                
                // 3. Seleciona o elemento, limpa o conteúdo anterior e renderiza com o jtab
                const $respostaEle = $('#resposta');
                $respostaEle.empty(); 
                
                jtab.render($respostaEle, apenas_letras); 

            } catch (error) {
                output.textContent = "Erro ao conectar com a API local.";
                console.error("Erro na requisição:", error);
            }
        }
        async function limpar() {
            document.getElementById("cifra").value = "";
            document.getElementById("resposta").textContent = "Aparecem aqui...";
        }
    </script>
</body>
</html>
